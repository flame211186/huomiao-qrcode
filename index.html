<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>微信扫码进群</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
        }

        .card {
            background: #fff;
            border-radius: 24px;
            padding: 48px 40px;
            text-align: center;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.15);
            max-width: 420px;
            width: 90%;
            animation: fadeIn 0.6s ease-out;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .title {
            font-size: 24px;
            font-weight: 700;
            color: #333;
            margin-bottom: 8px;
            letter-spacing: 1px;
        }

        .subtitle {
            font-size: 15px;
            color: #999;
            margin-bottom: 32px;
        }

        .qrcode-wrapper {
            display: inline-block;
            padding: 16px;
            border: 2px solid #f0f0f0;
            border-radius: 16px;
            margin-bottom: 24px;
        }

        .qrcode-wrapper img {
            display: block;
            width: 260px;
            height: 260px;
            border-radius: 8px;
        }

        .hint {
            font-size: 14px;
            color: #bbb;
        }

        .wechat-icon {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            margin-bottom: 20px;
        }

        .wechat-icon svg {
            width: 28px;
            height: 28px;
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="wechat-icon">
            <svg viewBox="0 0 24 24" fill="#07c160">
                <path d="M8.691 2.188C3.891 2.188 0 5.476 0 9.53c0 2.212 1.17 4.203 3.002 5.55a.59.59 0 0 1 .213.665l-.39 1.48c-.019.07-.048.141-.048.213 0 .163.13.295.29.295a.328.328 0 0 0 .167-.054l1.903-1.114a.864.864 0 0 1 .717-.098 10.16 10.16 0 0 0 2.837.403c.276 0 .543-.027.811-.05-.85-2.578.157-4.972 1.932-6.446 1.703-1.415 3.882-1.98 5.853-1.808-.576-3.683-4.196-6.336-8.596-6.336zM5.785 5.991c.642 0 1.162.529 1.162 1.18a1.17 1.17 0 0 1-1.162 1.178A1.17 1.17 0 0 1 4.623 7.17c0-.651.52-1.18 1.162-1.18zm5.813 0c.642 0 1.162.529 1.162 1.18a1.17 1.17 0 0 1-1.162 1.178 1.17 1.17 0 0 1-1.162-1.178c0-.651.52-1.18 1.162-1.18zm5.34 4.394c-3.846 0-6.966 2.64-6.966 5.9 0 3.26 3.12 5.9 6.966 5.9.71 0 1.394-.093 2.043-.265a.722.722 0 0 1 .598.082l1.584.926a.27.27 0 0 0 .14.043c.134 0 .244-.11.244-.244 0-.06-.024-.118-.04-.177l-.326-1.232a.492.492 0 0 1 .178-.554c1.533-1.124 2.5-2.79 2.5-4.66 0-3.26-3.12-5.717-6.965-5.717zm-2.42 2.473c.535 0 .969.44.969.982a.976.976 0 0 1-.969.98.976.976 0 0 1-.969-.98c0-.542.434-.982.969-.982zm4.84 0c.535 0 .969.44.969.982a.976.976 0 0 1-.969.98.976.976 0 0 1-.969-.98c0-.542.434-.982.969-.982z"/>
            </svg>
        </div>
        <h1 class="title">微信扫码进群</h1>
        <p class="subtitle">小程序在公告</p>
        <div class="qrcode-wrapper">
            <img src="qrcode.png" alt="微信群二维码">
        </div>
        <p class="hint">长按或扫描二维码即可加入群聊</p>
    </div>
</body>
</html>
